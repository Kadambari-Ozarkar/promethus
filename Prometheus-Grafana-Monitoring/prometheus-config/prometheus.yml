global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/alert_rules.yml"

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "172.31.22.232:9100"
        labels:
          server: "application-server-1"

      - targets:
          - "172.31.20.30:9100"
        labels:
          server: "application-server-2"
